# 网站配置文件
# 
# 如何添加新网站：
# 1. 在 sites: 列表中添加新配置项
# 2. 配置网站基本信息（name, base_url, encoding等）
# 3. 配置新闻列表页的CSS选择器（field_mapping）
# 4. 详细说明请查看 README.md
#
# 两种爬虫模式：
# - 普通爬虫：列表页包含所有信息，直接提取
# - 两阶段爬虫：列表页只有标题和链接，需要访问详情页获取完整内容
#   通过 common.two_stage_crawl 控制（true=两阶段，false=普通）

sites:
  # TopHub - 网易新闻实时热榜（第一阶段：获取新闻列表）
  - name: "TopHub网易热榜"
    enabled: true
    base_url: "https://tophub.today"
    encoding: "utf-8"
    request_delay: 2
    max_concurrent: 10  # 第二阶段最大并发请求数

    hot_news:
      enabled: true
      url: "https://tophub.today/n/ENeYa4DeY4"
      max_items: 15

      # TopHub页面实际结构：table.table tr
      field_mapping:
        container: "table.table tr"  # 选择带有class="table"的表格
        title:
          selector: "td:nth-child(3) a"
          attr: "text"
        url:
          selector: "td:nth-child(3) a"
          attr: "href"
        image_url:
          selector: "td:nth-child(2) img"
          attr: "src"

    today_focus:
      enabled: true
      # TopHub网易今日关注页面
      url: "https://tophub.today/n/Ywv4N8XePa"
      max_items: 15

      field_mapping:
        container: "table.table tr"
        # 今日关注页面结构不同，标题在第2列（索引1）
        title_column_index: 1
        image_column_index: -1  # 没有图片列

  # 中华网 - 要闻模块
  - name: "中华网要闻"
    enabled: true
    base_url: "https://news.china.com"
    encoding: "utf-8"
    request_delay: 2
    max_concurrent: 10  # 第二阶段最大并发请求数

    # 详情页提取配置
    detail_config:
      # 只提取 #js_article_content 中的内容作为正文
      article_selectors:
        - '#js_article_content'
      # 标题选择器（可选，如果不配置则使用默认的 h1, .title, title）
      # title_selectors:
      #   - 'h1'
      #   - '.title'
      # 时间选择器（可选，如果不配置则使用默认的 .s-ptime, .publish-time, time）
      # time_selectors:
      #   - '.publish-time'
      #   - 'time'
      # 来源选择器（可选，如果不配置则使用默认的 .s-source, .source）
      # source_selectors:
      #   - '.source'

    # 站点特定的后处理配置（会合并到全局配置）
    # 由于正文已经精确提取，只需要简单的清理即可
    post_processor:
      filters:
        content:
          # 移除编辑信息
          - pattern: '\(责任编辑[：:][^)]*\)'
            action: remove
            description: "移除责任编辑信息"
          # 清理多余空行
          - pattern: '\n\s*\n\s*\n+'
            action: replace
            replacement: '\n\n'
            description: "合并多个空行"

    hot_news:
      enabled: true
      url: "https://news.china.com/"
      max_items: 20

      field_mapping:
        # 中华网要闻模块：.wp_hot_con 容器直接包含多个 a 标签
        # 每个 a 标签就是一个新闻项，容器选择器选择这些 a 标签
        container: ".wp_hot_con a"
        title:
          # 容器元素本身就是 a 标签，使用空选择器让代码直接使用容器元素
          selector: ""
          attr: "text"
        url:
          selector: ""
          attr: "href"
        # 图片和时间在详情页获取（两阶段爬虫会自动处理）

  # ============================================
  # 添加新网站示例（取消注释并修改）：
  # ============================================
  #
  # - name: "新网站名称"
  #   enabled: true
  #   base_url: "https://example.com"
  #   encoding: "utf-8"
  #   request_delay: 1
  #

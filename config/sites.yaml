  #       title:
  #         selector: "a.title"           # 标题选择器
  #         attr: "text"                  # 提取文本
  #       url:
  #         selector: "a.title"
  #         attr: "href"                  # 提取链接
  #       image_url:                      # 可选
  #         selector: "img.thumb"
  #         attr: "src"
  #       publish_time:                   # 可选
  #         selector: ".time"
  #         attr: "text"
  #
  # 详细配置说明请查看 README.md

